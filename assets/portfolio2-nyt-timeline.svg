<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Career timeline comparison for Trump, Vance, Harris, and Walz</title>
  <desc id="desc">A stylized timeline of candidate ages and career categories from 18 to 78.</desc>
  <rect width="1200" height="800" fill="#ffffff"/>

  <text x="60" y="55" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#1a1a1a">Trump-Vance and Harris-Walz Career Timelines</text>
  <text x="60" y="82" font-family="Arial, sans-serif" font-size="16" fill="#4d4d4d">Career Progression of the 2024 Presidential Candidates</text>

  <g transform="translate(60,120)">
    <g>
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#111">Donald Trump</text>
      <rect x="210" y="-18" width="680" height="26" fill="#f7f7f7" rx="4"/>
      <rect x="210" y="-18" width="80" height="26" fill="#d6f3f3" rx="4"/>
      <rect x="290" y="-18" width="520" height="26" fill="#c3ebec" rx="4"/>
      <rect x="810" y="-18" width="80" height="26" fill="#a5dfe1" rx="4"/>
      <rect x="890" y="-18" width="60" height="26" fill="#6eb3b6" rx="4"/>
    </g>

    <g transform="translate(0,60)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#111">JD Vance</text>
      <rect x="210" y="-18" width="680" height="26" fill="#f7f7f7" rx="4"/>
      <rect x="210" y="-18" width="30" height="26" fill="#d6f3f3" rx="4"/>
      <rect x="240" y="-18" width="40" height="26" fill="#9ed8d9" rx="4"/>
      <rect x="280" y="-18" width="70" height="26" fill="#d6f3f3" rx="4"/>
      <rect x="350" y="-18" width="220" height="26" fill="#c3ebec" rx="4"/>
      <rect x="570" y="-18" width="40" height="26" fill="#6eb3b6" rx="4"/>
    </g>

    <g transform="translate(0,120)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#111">Kamala Harris</text>
      <rect x="210" y="-18" width="680" height="26" fill="#f7f7f7" rx="4"/>
      <rect x="210" y="-18" width="110" height="26" fill="#d6f3f3" rx="4"/>
      <rect x="320" y="-18" width="850" height="26" fill="#6eb3b6" rx="4"/>
      <rect x="610" y="-18" width="70" height="26" fill="#9ed8d9" rx="4"/>
      <rect x="680" y="-18" width="70" height="26" fill="#9ed8d9" rx="4"/>
    </g>

    <g transform="translate(0,180)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#111">Tim Walz</text>
      <rect x="210" y="-18" width="680" height="26" fill="#f7f7f7" rx="4"/>
      <rect x="210" y="-18" width="100" height="26" fill="#9ed8d9" rx="4"/>
      <rect x="310" y="-18" width="300" height="26" fill="#6eb3b6" rx="4"/>
      <rect x="610" y="-18" width="180" height="26" fill="#9ed8d9" rx="4"/>
      <rect x="790" y="-18" width="100" height="26" fill="#6eb3b6" rx="4"/>
    </g>

    <g transform="translate(210,260)">
      <line x1="0" y1="0" x2="680" y2="0" stroke="#d9d9d9" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#d9d9d9"/>
      <line x1="136" y1="0" x2="136" y2="8" stroke="#d9d9d9"/>
      <line x1="272" y1="0" x2="272" y2="8" stroke="#d9d9d9"/>
      <line x1="408" y1="0" x2="408" y2="8" stroke="#d9d9d9"/>
      <line x1="544" y1="0" x2="544" y2="8" stroke="#d9d9d9"/>
      <line x1="680" y1="0" x2="680" y2="8" stroke="#d9d9d9"/>
      <text x="-14" y="30" font-family="Arial, sans-serif" font-size="14" fill="#666">18</text>
      <text x="122" y="30" font-family="Arial, sans-serif" font-size="14" fill="#666">25</text>
      <text x="258" y="30" font-family="Arial, sans-serif" font-size="14" fill="#666">35</text>
      <text x="394" y="30" font-family="Arial, sans-serif" font-size="14" fill="#666">45</text>
      <text x="530" y="30" font-family="Arial, sans-serif" font-size="14" fill="#666">55</text>
      <text x="666" y="30" font-family="Arial, sans-serif" font-size="14" fill="#666">65</text>
      <text x="697" y="30" font-family="Arial, sans-serif" font-size="14" fill="#666">75</text>
      <text x="300" y="54" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#111">Age</text>
    </g>

    <g transform="translate(210,310)">
      <rect x="0" y="0" width="40" height="16" fill="#d6f3f3"/>
      <text x="52" y="14" font-family="Arial, sans-serif" font-size="14" fill="#333">College</text>

      <rect x="150" y="0" width="40" height="16" fill="#c3ebec"/>
      <text x="202" y="14" font-family="Arial, sans-serif" font-size="14" fill="#333">Private sector</text>

      <rect x="360" y="0" width="40" height="16" fill="#a5dfe1"/>
      <text x="412" y="14" font-family="Arial, sans-serif" font-size="14" fill="#333">Federal government</text>

      <rect x="610" y="0" width="40" height="16" fill="#9ed8d9"/>
      <text x="662" y="14" font-family="Arial, sans-serif" font-size="14" fill="#333">Military</text>

      <rect x="760" y="0" width="40" height="16" fill="#6eb3b6"/>
      <text x="812" y="14" font-family="Arial, sans-serif" font-size="14" fill="#333">Public service or politics</text>
    </g>
  </g>
</svg>
